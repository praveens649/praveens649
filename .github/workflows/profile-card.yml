name: Update Profile Card

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "tools/**"
      - ".github/workflows/profile-card.yml"

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/fetch_stats.py

      - name: Rebuild the card
        run: python tools/build_card.py

      - name: Rebuild the Pac-Man board
        run: python tools/build_pacman.py

      - name: Rebuild the link buttons
        run: python tools/build_links.py

      - name: Rebase onto any commits that landed meanwhile
        run: git pull --rebase --autostash origin main || true

      - name: Commit the regenerated card
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile card stats"
          branch: main
          file_pattern: "*.svg cache/*.json"

